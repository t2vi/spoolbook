# `image:` + `build:` together on each service: `docker compose build` builds from source and
# tags the result as that image name (what CI does, and what running this from a repo checkout
# does); `docker compose pull && up -d` (what the one-click installer does) just pulls the
# pre-built tag from GHCR — nobody running the installer has this source checked out.
services:
  spoolbook:
    image: ghcr.io/t2vi/spoolbook:latest
    build:
      context: .
      dockerfile: spoolbook-rs/Dockerfile
    ports:
      - "5070:5070"
    environment:
      - SPOOLBOOK_ADMIN_PASSWORD=${SPOOLBOOK_ADMIN_PASSWORD}
      - RESLICE_SERVICE_URL=http://spoolbook-slicer:8100
    volumes:
      - spoolbook-data:/data
    depends_on:
      spoolbook-slicer:
        condition: service_healthy
    restart: unless-stopped

  spoolbook-slicer:
    image: ghcr.io/t2vi/spoolbook-slicer:latest
    # BambuStudio ships no arm64 Linux build -- the AppImage this image extracts is x86_64-only
    # (slicer-service/Dockerfile). Pinned so an Apple Silicon host runs the whole container under
    # full amd64 emulation (Docker Desktop's Rosetta/QEMU path) instead of letting compose pick a
    # native arm64 base with just the one x86_64 binary inside it -- that mixed mode leaves the
    # single binary running through per-process binfmt translation, which chokes on BambuStudio's
    # Qt/WebKit-heavy ELF ("rosetta error: failed to open elf at /lib64/ld-linux-x86-64.so.2").
    platform: linux/amd64
    build:
      context: ./slicer-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  spoolbook-data:
