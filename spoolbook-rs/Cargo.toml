[package]
name = "spoolbook-rs"
version = "1.4.1"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
md5 = "0.7.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart"] }
roxmltree = "0.21.1"
rand = "0.8.5"
rumqttc = { version = "0.25.1", features = ["use-rustls"] }
rustls = "0.23.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
tokio-rustls = "0.26"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
zip = "8.6.0"
curl = { version = "0.4.50", default-features = false, features = ["protocol-ftp", "force-system-lib-on-osx", "ssl"] }

[dev-dependencies]
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
