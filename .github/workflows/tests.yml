name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test
        working-directory: spoolbook-rs

  # Browser tests: the real backend serving the built app, driven by Playwright (#180).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spoolbook-web-svelte/package-lock.json

      - run: npm ci
        working-directory: spoolbook-web-svelte

      - run: npx playwright install --with-deps chromium
        working-directory: spoolbook-web-svelte

      - run: npm run test:e2e
        working-directory: spoolbook-web-svelte

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: spoolbook-web-svelte/test-results

