name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
  workflow_run:
    workflows: ["Release builds"]
    types: [completed]

permissions:
  contents: write

jobs:
  build-deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    # Release builds upload per-OS assets across several matrix jobs — the Downloads page
    # fetches the release API at build time, so deploying on `release: published` directly
    # raced those uploads and could ship with assets missing. Wait for the whole "Release
    # builds" workflow to finish (and skip if it failed) instead.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-site/dist
          clean: true
